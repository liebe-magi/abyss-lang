name: Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run cargo check
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests and generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install stable toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Run cargo fmt
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings

  extension-check:
    name: Extension Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: editors/code
        run: bun install

      - name: Type check extension
        working-directory: editors/code
        run: bun run check

  build:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: abyss
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: abyss
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe

    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          profile: minimal
          target: ${{ matrix.target }}
          override: true
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cross-compilation tools (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - name: Build release version
        run: cargo build --verbose --release --target=${{ matrix.target }}

      - name: Export properties
        id: properties
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: build-${{ matrix.target }}-${{steps.properties.outputs.version}}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  extension-package:
    name: Extension Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/code
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Package VS Code extension
        id: package
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "Error: jq is not installed. Please ensure jq is available in the runner environment." >&2
            exit 1
          fi
          EXT_NAME=$(jq -r '.name // empty' package.json)
          EXT_VERSION=$(jq -r '.version // empty' package.json)
          if [[ -z "$EXT_NAME" ]]; then
            echo "Error: Could not extract 'name' from package.json or it is empty." >&2
            exit 1
          fi
          if [[ -z "$EXT_VERSION" ]]; then
            echo "Error: Could not extract 'version' from package.json or it is empty." >&2
            exit 1
          fi
          VSIX_NAME="${EXT_NAME}-${EXT_VERSION}.vsix"
          bunx vsce package -o "$VSIX_NAME"
          echo "vsix_name=$VSIX_NAME" >> $GITHUB_OUTPUT

      - name: Upload extension artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: extension-vsix
          path: editors/code/${{ steps.package.outputs.vsix_name }}



  draft-release:
    name: Release Draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/$GITHUB_REPOSITORY/releases \
            | tr '\r\n' ' ' \
            | jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' \
          curl -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/$GITHUB_REPOSITORY/releases/{}

      - name: Create a draft release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        id: createDraftRelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.version }}
          release_name: v${{ needs.build.outputs.version }}
          body: ""
          draft: true
          prerelease: false

      - name: Save upload url of this draft release.
        run: |
          echo '${{ steps.createDraftRelease.outputs.upload_url }}' > release_upload_url.txt

      - name: Upload `release_upload_url.txt`
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: draft-release
          path: release_upload_url.txt

  attach-assets-to-release:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
          - extension
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
            release_name_suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: abyss
            release_name_suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe
            release_name_suffix: ".exe"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
            release_name_suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: abyss
            release_name_suffix: ""
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe
            release_name_suffix: ".exe"
          - target: extension
            os: ubuntu-latest
            artifact_name: ${{ needs.extension-package.outputs.vsix_name }}
            release_name_suffix: ""
    needs: [build, draft-release, extension-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: draft-release

      - id: upload-url
        run: |
          echo "url=$(cat release_upload_url.txt)" >> $GITHUB_OUTPUT

      - name: Download CLI artifact
        if: matrix.target != 'extension'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: build-${{ matrix.target }}-${{ needs.build.outputs.version }}
          path: build/

      - name: Upload CLI release asset
        if: matrix.target != 'extension'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.upload-url.outputs.url }}
          asset_path: ./build/${{ matrix.artifact_name }}
          asset_name: abyss-${{ matrix.target }}-${{ needs.build.outputs.version }}${{ matrix.release_name_suffix }}
          asset_content_type: application/octet-stream

      - name: Download VSIX artifact
        if: matrix.target == 'extension' && needs.extension-package.result == 'success'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: extension-vsix
          path: extension/

      - name: Upload VSIX release asset
        if: matrix.target == 'extension' && needs.extension-package.result == 'success'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.upload-url.outputs.url }}
          asset_path: ./extension/${{ needs.extension-package.outputs.vsix_name }}
          asset_name: ${{ needs.extension-package.outputs.vsix_name }}
          asset_content_type: application/octet-stream
