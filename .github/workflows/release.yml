name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the version-bump check and re-run the release steps. Must be triggered from the `main` branch (other refs are ignored). Use after a partial failure — the workflow is safe to re-run: tag creation, draft release, and crates.io publishes skip work already done, while binary archives are rebuilt and re-uploaded deterministically (same names, `--clobber` overwrites)."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Defensive guard: this workflow must only ever produce a release from
    # the `main` branch. `workflow_dispatch` lets the operator pick any
    # ref from the UI, so without this check a manual retry from `develop`
    # could publish prerelease content to crates.io.
    if: github.ref == 'refs/heads/main'
    outputs:
      proceed: ${{ steps.check_version.outputs.proceed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable

      - name: Resolve target version
        id: check_version
        shell: bash
        run: |
          # Always work from a complete tag view so re-runs see tags pushed
          # by an earlier (possibly failed) attempt.
          git fetch --tags --force

          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Workspace version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Force mode (workflow_dispatch input): proceeding regardless of tag state."
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"
            if [ "v$VERSION" != "$LATEST_TAG" ]; then
              echo "Version bump detected ($LATEST_TAG -> v$VERSION)."
              echo "proceed=true" >> $GITHUB_OUTPUT
            else
              echo "No version bump (latest tag matches workspace version)."
              echo "proceed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run tests
        if: steps.check_version.outputs.proceed == 'true'
        run: cargo test --all-features

      - name: Create or confirm git tag
        if: steps.check_version.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION=${{ steps.check_version.outputs.version }}
          git fetch --tags --force
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally or on origin — leaving it as-is."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Probe release state
        id: release_state
        if: steps.check_version.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION=${{ steps.check_version.outputs.version }}
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — leaving its name, body, and draft state as-is."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist yet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        # Only create when the release doesn't exist yet. On retries the
        # existing release (potentially already published) keeps its
        # draft / non-draft state instead of being silently downgraded
        # back to a draft by another invocation of the action.
        if: steps.check_version.outputs.proceed == 'true' && steps.release_state.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Publish to crates.io (idempotent per crate)
        if: steps.check_version.outputs.proceed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          # `pipefail` is essential here: the version probe pipes curl into
          # python3, and we must not let curl's failure be hidden by python3
          # emitting an empty string — that would make us assume the crate is
          # unpublished and re-attempt `cargo publish`, which fails with
          # `already uploaded` and reintroduces the very mid-flight failure
          # this workflow guards against. With pipefail, a transient API
          # failure stops the step.
          set -euo pipefail
          VERSION=${{ steps.check_version.outputs.version }}

          # Single tempdir for every per-crate response, cleaned up on any
          # exit path (success, set -e abort, signal). Avoids leaking files
          # if a probe fails between mktemp and the explicit cleanup.
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          publish_if_missing() {
            local crate=$1
            local current http_code resp
            resp="$TMP/$crate.json"
            # crates.io returns HTTP 404 + `{"errors": [...]}` for an
            # unpublished crate, which is a legitimate "publish me" signal —
            # not an error. Capture the status code separately so we can
            # distinguish it from real failures (5xx, network), and avoid
            # `curl -f` (which would exit 22 on the 404 and break first-time
            # publishes of any new crate added to the workspace).
            # `--retry 3 --retry-delay 5` still rides out transient hiccups.
            #
            # `--user-agent` is required: crates.io's data-access policy
            # rejects requests without an identifying User-Agent (the
            # default `curl/x.y.z` UA is treated as anonymous bot traffic
            # and refused with 403, which is what knocked over a previous
            # backfill run from this very workflow). Identify the workflow
            # plus a contact URL so crates.io can reach the maintainer if
            # this workflow ever misbehaves.
            http_code=$(curl -sS --retry 3 --retry-delay 5 \
              --user-agent "abyss-lang-release-workflow (+https://github.com/$GITHUB_REPOSITORY)" \
              -w "%{http_code}" -o "$resp" \
              "https://crates.io/api/v1/crates/$crate")
            case "$http_code" in
              200) current=$(python3 -c "import json,sys; print(json.load(sys.stdin)['crate']['max_version'])" < "$resp") ;;
              404) current="" ;;
              *)
                echo "Unexpected HTTP $http_code probing crates.io for $crate; aborting." >&2
                cat "$resp" >&2
                return 1
                ;;
            esac
            if [ "$current" = "$VERSION" ]; then
              echo "$crate v$VERSION already on crates.io, skipping."
              return
            fi
            echo "Publishing $crate v$VERSION (crates.io currently at: ${current:-<unpublished>})."
            cargo publish -p "$crate"
            # Let the crates.io index propagate before the next dependent crate.
            sleep 30
          }

          # Publish in dependency order. abyss-interpreter depends on abyss-core;
          # abyss-lang depends on both.
          publish_if_missing abyss-core
          publish_if_missing abyss-interpreter
          publish_if_missing abyss-lang

  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_format: tar.gz
            binary: abyss
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_format: tar.gz
            binary: abyss
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_format: tar.gz
            binary: abyss
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_format: tar.gz
            binary: abyss
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_format: zip
            binary: abyss.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive_format: zip
            binary: abyss.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cross-compilation tools (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        run: cargo build --verbose --release --target=${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ needs.release.outputs.version }}
          STAGE="abyss-v${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi
          ls -la "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256"
          echo "ASSET=${STAGE}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SHA=${STAGE}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package archive (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.release.outputs.version }}'
          $stage = "abyss-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "$stage\"
          Copy-Item "LICENSE" "$stage\"
          Copy-Item "README.md" "$stage\"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = Get-FileHash "$stage.zip" -Algorithm SHA256
          # Match GNU `sha256sum` output format exactly: "<hex>  <filename>\n".
          # Use WriteAllText to force a single LF terminator on Windows;
          # earlier approaches could either omit the final newline entirely
          # (`Out-File -NoNewline`) or emit CRLF (`Out-File` defaults), and
          # strict checksum tooling expects exactly one LF-terminated record.
          [System.IO.File]::WriteAllText("$stage.zip.sha256", "$($hash.Hash.ToLower())  $stage.zip`n")
          Get-ChildItem "$stage.zip", "$stage.zip.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$stage.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_SHA=$stage.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}
          retention-days: 7
          if-no-files-found: error

  attach-binaries:
    name: Attach binaries to release
    needs: [release, build-binaries]
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la artifacts/

      - name: Attach assets to existing release
        # `gh release upload` strictly only adds files — it cannot touch the
        # release name, body, draft, or prerelease state. That guarantees
        # the metadata set by the `release` job (notes, draft, etc.) is
        # preserved when this step runs. `--clobber` makes the upload
        # idempotent on retry.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found under artifacts/" >&2
            exit 1
          fi
          gh release upload "v${{ needs.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${files[@]}"

  publish-extension:
    name: Publish VS Code extension
    needs: release
    if: needs.release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/code
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe Marketplace state
        id: marketplace_state
        shell: bash
        run: |
          # Mirrors the crates.io probe: pipefail so a transient API failure
          # cannot be silently rewritten as "unpublished" and trick us into
          # invoking `vsce publish` for a version that's already on the
          # Marketplace (which would fail with a less-clear error).
          set -euo pipefail
          VERSION=${{ needs.release.outputs.version }}
          current=$(curl -fsS --retry 3 --retry-delay 5 \
            -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -H "Content-Type: application/json" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"liebe-magi.abyss-codex-familiar"}]}],"flags":914}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); exts=d.get('results',[{}])[0].get('extensions',[]); print(exts[0]['versions'][0]['version'] if exts else '')")
          if [ "$current" = "$VERSION" ]; then
            echo "Marketplace already has abyss-codex-familiar v$VERSION, skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Marketplace at: ${current:-<unpublished>}, target: v$VERSION — will publish."
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to VS Code Marketplace
        if: steps.marketplace_state.outputs.should_publish == 'true'
        env:
          # PAT scoped to "Marketplace > Manage" on the publisher's
          # Azure DevOps account. Set as a repository Secret.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # `bunx vsce` resolves the local `@vscode/vsce` from the extension's
        # devDependencies; vsce reads `VSCE_PAT` from the environment and
        # invokes the `vscode:prepublish` script (`bun run compile`)
        # automatically before uploading.
        run: bunx vsce publish
