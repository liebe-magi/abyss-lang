codecov:
  branch: develop

coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 70%

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  hide_project_coverage: false

# `crates/abyss-wasm/src/bindings.rs` holds the `#[wasm_bindgen]` JS
# entry points. Their bodies touch `JsValue` which is effectively a stub
# under native `cargo test`, so they are intrinsically unreachable from
# our coverage runs. The testable surface (`run`, `PlaygroundBridge`,
# `EvalOutcome`) lives in `lib.rs` and stays under coverage.
#
# `crates/abyss-cli` is the terminal-facing shell: argv dispatch
# (`main.rs`), the interactive rustyline REPL loop (`repl.rs`), and thin
# print wrappers over library calls (`commands.rs`). Nothing in it is
# reachable from `cargo test` — it never had coverage — and all language
# logic lives in the covered `abyss-core` / `abyss-interpreter` crates.
ignore:
  - "crates/abyss-wasm/src/bindings.rs"
  - "crates/abyss-cli/**"
