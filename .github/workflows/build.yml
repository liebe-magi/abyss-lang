name: Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable

      - name: Run cargo check
        run: cargo check

  wasm-check:
    # Locks down wasm-readiness for the v0.6.0 Web Playground cycle:
    # `abyss-core` and `abyss-interpreter` must keep building for
    # `wasm32-unknown-unknown` (the future `crates/abyss-wasm` adapter
    # depends on this, and the playground feature would silently break
    # if a new dependency or `cfg` choice broke wasm support). The CLI
    # crate (`abyss-lang`) is excluded — it pulls in `rustyline` /
    # `dirs` / `colored` which are CLI-only and intentionally not
    # wasm-compatible.
    name: Wasm Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run cargo check (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p abyss-core -p abyss-interpreter -p abyss-wasm

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run version check
        run: python3 scripts/check_version_sync.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests and generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: true

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  extension-check:
    name: Extension Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: editors/code
        run: bun install --frozen-lockfile

      - name: Type check extension
        working-directory: editors/code
        run: bun run check

  build:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: abyss
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: abyss
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: abyss
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: abyss.exe

    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-04
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cross-compilation tools (Windows ARM64)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release version
        run: cargo build --verbose --release --target=${{ matrix.target }}

      - name: Export properties
        id: properties
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}-${{steps.properties.outputs.version}}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  extension-package:
    name: Extension Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/code
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package VS Code extension
        id: package
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "Error: jq is not installed. Please ensure jq is available in the runner environment." >&2
            exit 1
          fi
          EXT_NAME=$(jq -r '.name // empty' package.json)
          EXT_VERSION=$(jq -r '.version // empty' package.json)
          if [[ -z "$EXT_NAME" ]]; then
            echo "Error: Could not extract 'name' from package.json or it is empty." >&2
            exit 1
          fi
          if [[ -z "$EXT_VERSION" ]]; then
            echo "Error: Could not extract 'version' from package.json or it is empty." >&2
            exit 1
          fi
          VSIX_NAME="${EXT_NAME}-${EXT_VERSION}.vsix"
          bunx vsce package -o "$VSIX_NAME"
          echo "vsix_name=$VSIX_NAME" >> $GITHUB_OUTPUT

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-vsix
          path: editors/code/${{ steps.package.outputs.vsix_name }}


