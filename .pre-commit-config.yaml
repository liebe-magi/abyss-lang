repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: cargo fmt
        language: system
        files: \.rs$
        args: [--all, --]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources
        entry: cargo clippy
        language: system
        files: \.rs$
        args: [--all-targets, --all-features, --, -D, warnings]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check the package for errors
        entry: cargo check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        description: Run tests
        entry: cargo test
        language: system
        files: \.rs$
        pass_filenames: false

      - id: bun-extension-build
        name: bun run compile (VS Code extension)
        description: Compile the AbySS Codex Familiar extension via Bun before committing
        entry: bash
        language: system
        pass_filenames: false
        files: ^editors/code/
        args:
          - -c
          - |
            cd editors/code
            if ! bun install --frozen-lockfile; then
              echo "error: Lockfile is out of sync. Please run 'bun install' in editors/code and commit the updated lockfile." >&2
              exit 1
            fi
            bun run compile

      - id: check-version-sync
        name: check version sync
        description: Check if Cargo.toml and package.json versions match
        entry: python3 scripts/check_version_sync.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|editors/code/package\.json)$
